name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            build-essential

      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip

          python -m pip install \
            "cython==0.29.36" \
            "buildozer==1.5.0"

          buildozer --version
          cython --version

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          test -x "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;28.2.13676358"

          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/build-tools/35.0.0/aidl"
          test -x "$SDK/build-tools/35.0.0/aapt"

          test -d "$SDK/platforms/android-35"
          test -d "$SDK/ndk/28.2.13676358"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROIDSDK=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/28.2.13676358" >> "$GITHUB_ENV"

      - name: Prepare Buildozer SDK bridge
        shell: bash
        run: |
          set -euxo pipefail

          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"

          test -n "$SDK"

          BD_ROOT="$HOME/.buildozer/android/platform"
          BD_SDK="$BD_ROOT/android-sdk"

          mkdir -p "$BD_ROOT"

          rm -rf "$BD_SDK"

          ln -s "$SDK" "$BD_SDK"

          mkdir -p "$SDK/tools/bin"

          ln -sfn \
            "$SDK/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK/tools/bin/sdkmanager"

          test -L "$BD_SDK"
          test -x "$BD_SDK/tools/bin/sdkmanager"
          test -x "$BD_SDK/platform-tools/adb"
          test -x "$BD_SDK/build-tools/35.0.0/aidl"
          test -x "$BD_SDK/build-tools/35.0.0/aapt"

          echo "Buildozer SDK bridge is ready."
          echo "SDK: $SDK"
          echo "Buildozer SDK: $BD_SDK"

      - name: Prepare Buildozer configuration
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec

          # اجازه می‌دهیم Buildozer در صورت نیاز از sdkmanager استفاده کند.
          sed -i \
            '/^[[:space:]]*android\.skip_update[[:space:]]*=/d' \
            buildozer.spec

          # Keep the Android Python runtime pinned to the tested 3.11 recipe.
          grep -q 'python3==3.11.10,hostpython3==3.11.10' buildozer.spec

          echo "========================================"
          echo "         BUILDOWER SPEC"
          echo "========================================"

          cat buildozer.spec

      - name: Prepare runtime configuration
        shell: bash
        env:
          FRAHOOSH_SUPABASE_URL: ${{ secrets.FRAHOOSH_SUPABASE_URL }}
          FRAHOOSH_SUPABASE_ANON_KEY: ${{ secrets.FRAHOOSH_SUPABASE_ANON_KEY }}
          FRAHOOSH_SCHOOL_ID: ${{ vars.FRAHOOSH_SCHOOL_ID }}
          FRAHOOSH_SCHOOL_NAME: ${{ vars.FRAHOOSH_SCHOOL_NAME }}
          FRAHOOSH_SCHOOL_YEAR: ${{ vars.FRAHOOSH_SCHOOL_YEAR }}
        run: |
          set -euxo pipefail

          test -n "$FRAHOOSH_SUPABASE_URL"
          test -n "$FRAHOOSH_SUPABASE_ANON_KEY"
          test -n "$FRAHOOSH_SCHOOL_ID"
          test -n "$FRAHOOSH_SCHOOL_NAME"
          test -n "$FRAHOOSH_SCHOOL_YEAR"

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = {
              "FRAHOOSH_SUPABASE_URL": os.environ["FRAHOOSH_SUPABASE_URL"],
              "FRAHOOSH_SUPABASE_ANON_KEY": os.environ["FRAHOOSH_SUPABASE_ANON_KEY"],
              "FRAHOOSH_SCHOOL_ID": os.environ["FRAHOOSH_SCHOOL_ID"],
              "FRAHOOSH_SCHOOL_NAME": os.environ["FRAHOOSH_SCHOOL_NAME"],
              "FRAHOOSH_SCHOOL_YEAR": os.environ["FRAHOOSH_SCHOOL_YEAR"],
          }

          Path("mobile/runtime_config.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          PY

          python -m json.tool mobile/runtime_config.json >/dev/null
          echo "Runtime configuration generated."

      - name: Validate project files
        shell: bash
        run: |
          set -euxo pipefail

          test -f buildozer.spec
          test -f main.py

          if [ -f mobile/config.py ]; then
            echo "mobile/config.py found"
          fi

          if [ -f requirements.txt ]; then
            echo "requirements.txt found"
            cat requirements.txt
          fi

      - name: Validate Python sources
        shell: bash
        run: |
          set -euxo pipefail

          python -m compileall -q . \
            -x '(^|/)(\.git|\.buildozer|bin|__pycache__|tests)(/|$)'

      - name: Build Frahoosh APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "       BUILDING FRAHOOSH APK"
          echo "========================================"

          rm -rf bin

          buildozer android debug

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "========================================"
          echo "         VERIFY FRAHOOSH APK"
          echo "========================================"

          test -d bin

          echo "Contents of bin:"
          ls -lah bin/

          APK_COUNT="$(find bin -maxdepth 1 -type f -name '*.apk' | wc -l)"

          echo "APK COUNT: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."

            echo "Build directory contents:"

            find . -maxdepth 4 -type f \
              \( -name "*.apk" -o -name "*.aab" \) \
              -print || true

            exit 1
          fi

          echo "APK SUCCESSFULLY CREATED."

          find bin \
            -maxdepth 1 \
            -type f \
            -name "*.apk" \
            -print

      - name: Show APK information
        if: success()
        shell: bash
        run: |
          set -euxo pipefail

          APK="$(find bin -maxdepth 1 -type f -name '*.apk' | head -n 1)"

          test -n "$APK"
          test -f "$APK"

          echo "========================================"
          echo "          FRAHOOSH APK READY"
          echo "========================================"

          echo "APK FILE:"
          echo "$APK"

          echo "APK SIZE:"

          du -h "$APK"

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14         
          
