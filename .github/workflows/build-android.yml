name: Frahoosh Android Build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build Frahoosh APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.10"
          cache: pip

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: System dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y git zip unzip wget curl autoconf automake libtool pkg-config zlib1g-dev libffi-dev libssl-dev build-essential cmake

      - name: Python build tools
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip setuptools wheel virtualenv
          python -m pip install "cython==0.29.36" "buildozer==1.5.0"
          buildozer --version

      - name: Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: tools platform-tools

      - name: Install Android packages
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK"
          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;25.2.9519653"
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/build-tools/35.0.0/aapt"
          test -d "$SDK/platforms/android-35"
          test -d "$SDK/ndk/25.2.9519653"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "ANDROIDSDK=$SDK"
            echo "ANDROID_NDK_HOME=$SDK/ndk/25.2.9519653"
            echo "ANDROID_NDK_ROOT=$SDK/ndk/25.2.9519653"
          } >> "$GITHUB_ENV"

      - name: Prepare clean Buildozer state
        run: |
          set -euxo pipefail
          rm -rf bin .buildozer
          mkdir -p "$HOME/.buildozer/android/platform"

      - name: Prepare Buildozer SDK bridge
        run: |
          set -euxo pipefail
          SDK="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BD_SDK="$HOME/.buildozer/android/platform/android-sdk"
          ln -s "$SDK" "$BD_SDK"
          mkdir -p "$SDK/tools/bin"
          ln -sfn "$SDK/cmdline-tools/latest/bin/sdkmanager" "$SDK/tools/bin/sdkmanager"

      - name: Prepare runtime configuration
        env:
          FRAHOOSH_SUPABASE_URL: ${{ secrets.FRAHOOSH_SUPABASE_URL }}
          FRAHOOSH_SUPABASE_ANON_KEY: ${{ secrets.FRAHOOSH_SUPABASE_ANON_KEY }}
          FRAHOOSH_SCHOOL_ID: ${{ vars.FRAHOOSH_SCHOOL_ID }}
          FRAHOOSH_SCHOOL_NAME: ${{ vars.FRAHOOSH_SCHOOL_NAME }}
          FRAHOOSH_SCHOOL_YEAR: ${{ vars.FRAHOOSH_SCHOOL_YEAR }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          required = [
              "FRAHOOSH_SUPABASE_URL",
              "FRAHOOSH_SUPABASE_ANON_KEY",
              "FRAHOOSH_SCHOOL_ID",
              "FRAHOOSH_SCHOOL_NAME",
              "FRAHOOSH_SCHOOL_YEAR",
          ]
          missing = [k for k in required if not os.environ.get(k)]
          if missing:
              raise SystemExit("Missing GitHub configuration: " + ", ".join(missing))
          Path("mobile/runtime_config.json").write_text(
              json.dumps({k: os.environ[k] for k in required}, ensure_ascii=False, indent=2),
              encoding="utf-8"
          )
          PY

      - name: Validate Python
        run: python -m compileall -q mobile main.py

      - name: Build APK
        shell: bash
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-build-log
          path: buildozer.log
          retention-days: 7

      - name: Verify APK
        run: |
          set -euxo pipefail
          test -d bin
          test -n "$(find bin -name '*.apk' -print -quit)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: frahoosh-apk
          path: bin/*.apk
          retention-days: 14
